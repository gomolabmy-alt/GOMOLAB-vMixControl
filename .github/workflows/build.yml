name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Plain build-health-check — every push to main and manual runs. Skipped on
  # a version tag push: the release job below builds those itself (signed,
  # with updater artifacts), so building here too would just be redundant.
  build:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          - platform: macos-13
            target: x86_64-apple-darwin
            label: mac-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build Tauri (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --target ${{ matrix.target }}

      # ── Upload macOS artifacts ─────────────────────────────────────────────
      - name: Upload .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GOMOLAB-vMixControl-${{ matrix.label }}.dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload .app (zip)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GOMOLAB-vMixControl-${{ matrix.label }}.app
          path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      # ── Upload Windows artifacts ───────────────────────────────────────────
      - name: Upload .msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GOMOLAB-vMixControl-${{ matrix.label }}.msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Upload .exe (NSIS)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GOMOLAB-vMixControl-${{ matrix.label }}-setup.exe
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # ── Build, sign, and publish a GitHub Release on tag push ─────────────────
  # A separate, self-contained build (not the "build" job above) because
  # tauri-action needs to run `tauri build` itself, with the updater signing
  # env vars set, to produce the .sig files + latest.json the in-app updater
  # (UpdateChecker.tsx) polls for. One release, built up across all three
  # platforms in this same matrix — tauri-action creates it on the first job
  # to finish and just appends assets from the other two.
  #
  # Required repo secrets (Settings -> Secrets and variables -> Actions):
  #   TAURI_SIGNING_PRIVATE_KEY          the private half of the updater
  #                                       keypair (`tauri signer generate`)
  #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  that key's password
  # Released as a DRAFT — nothing goes out to any installed copy of the app
  # until a human opens it on GitHub and clicks Publish (that's also the
  # moment /releases/latest/download/latest.json starts resolving, which is
  # what UpdateChecker.tsx is actually polling).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Build, sign, and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GOMOLAB vMix Control ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
